<div id="historyTab" class="tab-content"{% if initial_tab != 'history' %} style="display: none;"{% endif %}>
    <section class="workspace-page-head workspace-page-head--history">
        <div>
            <div class="workspace-page-head-title">历史记录</div>
            <div class="workspace-page-head-subtitle">客户 / 金额 / 匹配率</div>
        </div>
        <div class="workspace-page-head-actions">
            <a href="{{ workspace_routes.quotes }}" class="btn btn-primary btn-sm">
                <i class="bi bi-layout-text-window me-1"></i>报价台
            </a>
            <a href="{{ workspace_routes.templates }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-files me-1"></i>模板
            </a>
            <a href="{{ workspace_routes.catalog }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-grid-3x3-gap me-1"></i>商品库
            </a>
        </div>
    </section>

    <section class="history-metric-grid">
        <article class="history-metric-card">
            <span class="history-metric-label">总报价数</span>
            <strong id="statTotalCount" class="history-metric-value">0</strong>
            <small class="history-metric-copy">全部</small>
        </article>
        <article class="history-metric-card">
            <span class="history-metric-label">本月新增</span>
            <strong id="statMonthCount" class="history-metric-value">0</strong>
            <small class="history-metric-copy">本月</small>
        </article>
        <article class="history-metric-card">
            <span class="history-metric-label">累计金额</span>
            <strong id="statTotalAmount" class="history-metric-value">¥0</strong>
            <small class="history-metric-copy">累计</small>
        </article>
        <article class="history-metric-card">
            <span class="history-metric-label">平均匹配率</span>
            <strong id="statAvgRate" class="history-metric-value">0%</strong>
            <small class="history-metric-copy">整体</small>
        </article>
    </section>

    <section class="history-ledger-shell">
        <div class="history-ledger-header">
            <div>
                <div class="history-ledger-kicker">历史</div>
                <div class="history-ledger-heading">报价记录</div>
                <div class="history-ledger-subtitle">客户 / 金额 / 匹配率</div>
            </div>
            <div class="history-ledger-header-note">
                <i class="bi bi-stars"></i>
                <span>低匹配率优先</span>
            </div>
        </div>
        <div id="historyList" class="history-ledger-list">
            <div class="workspace-empty-orbit workspace-empty-orbit--history">
                <div class="workspace-empty-orbit-visual">
                    <i class="bi bi-hourglass-split"></i>
                </div>
                <div class="workspace-empty-orbit-title">暂无历史</div>
                <div class="workspace-empty-orbit-copy">有记录后在这里显示。</div>
            </div>
        </div>
    </section>
</div>
