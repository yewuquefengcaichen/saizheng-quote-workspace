<div id="catalogTab" class="tab-content"{% if initial_tab != 'catalog' %} style="display: none;"{% endif %}>
    <section class="catalog-page-head">
        <div>
            <div class="catalog-page-kicker">赛正报价工作台 @feng</div>
            <div class="catalog-page-title">商品库</div>
            <div class="catalog-page-subtitle">筛选 / 同步 / 图搜图</div>
        </div>
        <div class="catalog-page-actions">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="WorkspaceEntryActions.openProductsUpload()">
                <i class="bi bi-box-arrow-in-up-right me-1"></i>更新商品库
            </button>
            <button type="button" class="btn btn-outline-success btn-sm" id="catalogSyncV2Btn">
                <i class="bi bi-database-up me-1"></i>同步 V2
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="catalogMallPreviewBtn">
                <i class="bi bi-eye me-1"></i>预检商城
            </button>
            <button type="button" class="btn btn-outline-primary btn-sm" id="catalogMallScrapeBtn">
                <i class="bi bi-cloud-download me-1"></i>抓商城
            </button>
            <button type="button" class="btn btn-outline-info btn-sm" id="catalogClipEmbeddingBtn">
                <i class="bi bi-stars me-1"></i>生成 CLIP
            </button>
            <input type="file" class="d-none" id="catalogImageSearchInput" accept="image/*" capture="environment">
            <button type="button" class="btn btn-outline-info btn-sm" id="catalogImageSearchTriggerBtn">
                <i class="bi bi-camera me-1"></i>图搜商品
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="catalogImagePasteBtn">
                <i class="bi bi-clipboard-image me-1"></i>粘贴图片
            </button>
            <span class="workspace-source-chip workspace-source-chip--compact" id="catalogProductsSourceChip"></span>
            <a href="{{ workspace_routes.quotes }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-layout-text-window me-1"></i>去报价台
            </a>
            <a href="{{ workspace_routes.templates }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-files me-1"></i>模板中心
            </a>
        </div>
    </section>

    <div class="catalog-summary" id="catalogSummary">
        <div class="catalog-summary-item">
            <div class="value" id="catalogTotalCount">0</div>
            <div class="label">总商品数</div>
        </div>
        <div class="catalog-summary-item">
            <div class="value" id="catalogVisibleCount">0</div>
            <div class="label">当前展示</div>
        </div>
        <div class="catalog-summary-item">
            <div class="value" id="catalogImageCount">0</div>
            <div class="label">有图商品</div>
        </div>
        <div class="catalog-summary-item">
            <div class="value" id="catalogPageInfo">1 / 1</div>
            <div class="label">页码</div>
        </div>
    </div>

    <div class="catalog-toolbar catalog-toolbar--atelier">
        <div class="catalog-toolbar-topbar">
            <div>
                <div class="catalog-toolbar-heading">筛选器</div>
                <div class="catalog-toolbar-subheading">快速定位商品。</div>
            </div>
            <div class="catalog-toolbar-actions">
                <button class="btn btn-outline-secondary btn-sm" id="catalogResetBtn">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>重置
                </button>
            </div>
        </div>
        <div class="row g-3 align-items-end">
            <div class="col-xl-3 col-lg-4 col-md-6">
                <label class="form-label">搜索商品</label>
                <input type="text" class="form-control" id="catalogKeyword" placeholder="按编码、名称、规格、品牌或供应商搜索">
            </div>
            <div class="col-xl-2 col-lg-4 col-md-6">
                <label class="form-label">分类</label>
                <select class="form-select" id="catalogCategoryFilter">
                    <option value="">全部分类</option>
                    {% for category in catalog_categories %}
                    <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-xl-2 col-lg-4 col-md-6">
                <label class="form-label">品牌</label>
                <select class="form-select" id="catalogBrandFilter">
                    <option value="">全部品牌</option>
                    {% for brand in catalog_brands %}
                    <option value="{{ brand }}">{{ brand }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-xl-2 col-lg-4 col-md-6">
                <label class="form-label">供应商</label>
                <select class="form-select" id="catalogSupplierFilter">
                    <option value="">全部供应商</option>
                    {% for supplier in catalog_suppliers %}
                    <option value="{{ supplier }}">{{ supplier }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-xl-1 col-lg-4 col-md-6 catalog-filter-col--tiny">
                <label class="form-label">图片</label>
                <select class="form-select" id="catalogImageFilter">
                    <option value="">全部</option>
                    <option value="yes">仅有图</option>
                    <option value="no">仅无图</option>
                </select>
            </div>
            <div class="col-xl-1 col-lg-4 col-md-6 catalog-filter-col--tiny">
                <label class="form-label">商城</label>
                <select class="form-select" id="catalogMallVisibilityFilter">
                    <option value="">全部</option>
                    <option value="seen">正常</option>
                    <option value="missing">疑似下架</option>
                    <option value="inactive_candidate">连续缺失</option>
                </select>
            </div>
            <div class="col-xl-1 col-lg-4 col-md-6 catalog-filter-col--tiny">
                <label class="form-label">每页数量</label>
                <select class="form-select" id="catalogPageSize">
                    <option value="36" selected>36</option>
                    <option value="48">48</option>
                    <option value="60">60</option>
                    <option value="72">72</option>
                    <option value="24">24</option>
                </select>
            </div>
        </div>
        <div class="row g-3 mt-1 align-items-center">
            <div class="col-md-12">
                <div class="catalog-mall-sync-options" id="catalogMallSyncOptions">
                    <span class="catalog-mall-sync-label">商城抓取</span>
                    <select class="form-select form-select-sm" id="catalogMallScrapeMode" aria-label="商城抓取模式">
                        <option value="small" selected>小批量</option>
                        <option value="full">全量</option>
                    </select>
                    <select class="form-select form-select-sm" id="catalogMallMaxPages" aria-label="商城抓取页数">
                        <option value="2" selected>2页</option>
                        <option value="10">10页</option>
                        <option value="50">50页</option>
                        <option value="100">100页</option>
                    </select>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="catalogMallFetchDetailImages">
                        <label class="form-check-label" for="catalogMallFetchDetailImages">详情补图</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="catalogMallResumeEnabled" checked>
                        <label class="form-check-label" for="catalogMallResumeEnabled">断点续抓</label>
                    </div>
                </div>
                <div class="catalog-toolbar-note" id="catalogToolbarHint"><i class="bi bi-grid-3x3-gap"></i><span>默认有图优先。</span></div>
                <div class="catalog-toolbar-note mt-2" id="catalogSyncV2Status"><i class="bi bi-database"></i><span>V2 同步状态读取中…</span></div>
                <div class="catalog-image-search-status mt-2" id="catalogImageSearchStatus" style="display: none;"></div>
                <div class="catalog-sync-mini-strip mt-2" id="catalogMallSyncBrief" style="display: none;"></div>
                <div class="catalog-sync-issues mt-2" id="catalogMallSyncIssues" style="display: none;"></div>
                <div class="catalog-sync-history mt-2" id="catalogMallSyncHistory" style="display: none;"></div>
                <div class="catalog-toolbar-note mt-2 catalog-embedding-status" id="catalogImageEmbeddingStatus"><i class="bi bi-images"></i><span>图搜图向量状态读取中…</span></div>
                <div class="catalog-toolbar-note mt-2 catalog-embedding-job-status" id="catalogImageEmbeddingJobStatus" style="display: none;"><i class="bi bi-hourglass-split"></i><span></span></div>
            </div>
        </div>
    </div>

    <div id="catalogResults" class="catalog-grid"></div>
    <div id="catalogPagination" class="mt-4"></div>
</div>
