<div id="synonymsTab" class="tab-content"{% if initial_tab != 'synonyms' %} style="display: none;"{% endif %}>
    <section class="workspace-page-head workspace-page-head--synonyms">
        <div>
            <div class="workspace-page-head-title">词库</div>
            <div class="workspace-page-head-subtitle">主词 / 变体 / 编辑</div>
        </div>
        <div class="workspace-page-head-actions">
            <button class="btn btn-primary btn-sm" id="addSynonymBtn" type="button">
                <i class="bi bi-plus-lg me-1"></i>新增
            </button>
            <a href="{{ workspace_routes.quotes }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-layout-text-window me-1"></i>报价台
            </a>
            <a href="{{ workspace_routes.catalog }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-grid-3x3-gap me-1"></i>商品库
            </a>
        </div>
    </section>

    <section class="history-metric-grid vocabulary-metric-grid">
        <article class="history-metric-card">
            <span class="history-metric-label">主词数</span>
            <strong id="synonymMetricHeadword" class="history-metric-value">0</strong>
            <small class="history-metric-copy">当前</small>
        </article>
        <article class="history-metric-card">
            <span class="history-metric-label">变体数</span>
            <strong id="synonymMetricVariant" class="history-metric-value">0</strong>
            <small class="history-metric-copy">全部</small>
        </article>
        <article class="history-metric-card">
            <span class="history-metric-label">平均覆盖</span>
            <strong id="synonymMetricAverage" class="history-metric-value">0</strong>
            <small class="history-metric-copy">平均</small>
        </article>
        <article class="history-metric-card">
            <span class="history-metric-label">当前状态</span>
            <strong id="synonymMetricHint" class="history-metric-value">待补充</strong>
            <small class="history-metric-copy">高频优先</small>
        </article>
    </section>

    <section class="workspace-guidance-grid workspace-guidance-grid--synonyms-snapshot">
        <article class="workspace-guidance-card workspace-guidance-card--stat">
            <span class="workspace-guidance-kicker">主词</span>
            <strong class="workspace-guidance-title" id="synonymHeadwordCount">0</strong>
            <p class="workspace-guidance-copy">快照</p>
        </article>
        <article class="workspace-guidance-card workspace-guidance-card--stat">
            <span class="workspace-guidance-kicker">变体</span>
            <strong class="workspace-guidance-title" id="synonymVariantCount">0</strong>
            <p class="workspace-guidance-copy">数量</p>
        </article>
        <article class="workspace-guidance-card workspace-guidance-card--stat">
            <span class="workspace-guidance-kicker">最大组</span>
            <strong class="workspace-guidance-title" id="synonymLargestHeadword">-</strong>
            <p class="workspace-guidance-copy">主词</p>
        </article>
    </section>

    <section class="vocabulary-ledger-shell">
        <div class="history-ledger-header">
            <div>
                <div class="history-ledger-kicker">词库</div>
                <div class="history-ledger-heading">词库卡片</div>
                <div class="history-ledger-subtitle">主词 / 覆盖 / 编辑</div>
            </div>
            <div class="history-ledger-header-note">
                <i class="bi bi-stars"></i>
                <span>高频优先</span>
            </div>
        </div>
        <div id="synonymsList" class="vocabulary-card-grid">
            <div class="workspace-empty-orbit workspace-empty-orbit--vocabulary">
                <div class="workspace-empty-orbit-visual">
                    <i class="bi bi-book"></i>
                </div>
                <div class="workspace-empty-orbit-title">暂无词库</div>
                <div class="workspace-empty-orbit-copy">新增后在这里显示。</div>
            </div>
        </div>
    </section>
</div>
