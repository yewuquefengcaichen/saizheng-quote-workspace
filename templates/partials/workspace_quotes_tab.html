<div id="matchTab" class="tab-content"{% if initial_tab != 'match' %} style="display: none;"{% endif %}>
    <section class="quote-page-head quote-page-head--compact">
        <div class="quote-page-headline">
            <div class="quote-page-title">报价工作台</div>
        </div>
        <div class="quote-toolbar-actions">
            <button type="button" class="btn btn-primary btn-sm" onclick="WorkspaceEntryActions.openQuoteUpload()">
                <i class="bi bi-file-earmark-arrow-up me-1"></i>上传报价
            </button>
            <button type="button" class="btn btn-outline-info btn-sm" data-ocr-entry="true" onclick="WorkspaceEntryActions.openOCRUpload()">
                <i class="bi bi-camera me-1"></i>OCR 图片
            </button>
        </div>
    </section>

    <div class="filter-bar quote-filter-bar">
        <div class="quote-filter-inline">
            <div class="quote-filter-search">
                <label class="quote-filter-inline-label" for="searchInput">报价项</label>
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="searchInput" placeholder="搜名称、规格、备注、品牌或供应商">
                    <button class="btn btn-outline-secondary" type="button" id="clearSearchBtn" title="清空搜索">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <div class="quote-filter-select">
                <label class="quote-filter-inline-label" for="statusFilter">状态</label>
                <select class="form-select form-select-sm" id="statusFilter">
                    <option value="all">全部状态</option>
                    <option value="pending">待确认</option>
                    <option value="matched">已匹配</option>
                    <option value="nomatch">无匹配</option>
                </select>
            </div>
            <div class="quote-filter-select">
                <label class="quote-filter-inline-label" for="sortFilter">排序</label>
                <select class="form-select form-select-sm" id="sortFilter">
                    <option value="default">默认排序</option>
                    <option value="match-desc">匹配度从高到低</option>
                    <option value="match-asc">匹配度从低到高</option>
                    <option value="price-desc">价格从高到低</option>
                    <option value="price-asc">价格从低到高</option>
                </select>
            </div>
            <button class="btn btn-outline-secondary btn-sm quote-filter-reset" id="resetFilterBtn">
                <i class="bi bi-arrow-counterclockwise me-1"></i>重置
            </button>
            <div class="quote-toolbar-actions quote-toolbar-actions--dense">
                <div class="btn-group btn-group-sm quote-view-switch" role="group" aria-label="候选视图切换">
                    <button class="btn btn-outline-secondary is-active" type="button" id="candidateViewStandardBtn" data-candidate-view="standard">标准视图</button>
                    <button class="btn btn-outline-secondary" type="button" id="candidateViewCompactBtn" data-candidate-view="compact">紧凑视图</button>
                </div>
                <button class="btn btn-outline-secondary btn-sm" type="button" id="quoteSplitResetBtn" title="恢复默认分栏宽度">
                    <i class="bi bi-layout-split me-1"></i>恢复分栏
                </button>
                <button class="btn btn-warning btn-sm" id="batchAdjustBtn">
                    <i class="bi bi-percent me-1"></i>批量调价
                </button>
                <button class="btn btn-outline-primary btn-sm" type="button" onclick="showExportOptions('dropdown_default')">
                    <i class="bi bi-list-check me-1"></i>候选报价单
                </button>
                <button class="btn btn-success btn-sm" id="exportBtn">
                    <i class="bi bi-download me-1"></i>导出
                </button>
            </div>
        </div>
        <div class="row mt-3" id="priceAdjustNotice" style="display: none;">
            <div class="col-12">
                <div class="match-notice-card">
                    <div class="match-notice-text"><i class="bi bi-info-circle me-2"></i><span id="adjustNoticeText"></span></div>
                    <button class="btn btn-sm btn-outline-secondary" id="clearAdjustBtn">清除调整</button>
                </div>
            </div>
        </div>
    </div>

    <div id="matchResults">
        <div class="workspace-empty-orbit workspace-empty-orbit--quotes workspace-empty-orbit--quotes-landing">
            <div class="quote-empty-layout quote-empty-layout--compact">
                <div class="quote-empty-card quote-empty-stage">
                    <span class="quote-empty-card-kicker">上传</span>
                    <strong class="quote-empty-card-title">先上传报价单</strong>
                    <div class="quote-empty-actions">
                        <button type="button" class="btn btn-primary" onclick="WorkspaceEntryActions.openQuoteUpload()">
                            <i class="bi bi-file-earmark-arrow-up me-2"></i>上传报价单
                        </button>
                        <button type="button" class="btn btn-outline-info" data-ocr-entry="true" onclick="WorkspaceEntryActions.openOCRUpload()">
                            <i class="bi bi-camera me-2"></i>OCR 图片
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
