<div id="matchTab" class="tab-content"{% if initial_tab != 'match' %} style="display: none;"{% endif %}>
    <section class="quote-page-head">
        <div>
            <div class="quote-page-kicker">报价确认</div>
            <div class="quote-page-title">报价工作台</div>
            <div class="quote-page-subtitle">本页可直接上传报价单、OCR 和补传商品库。处理完成后再去导出。</div>
        </div>
        <div class="quote-toolbar-actions">
            <button type="button" class="btn btn-primary btn-sm" onclick="document.getElementById('quoteFile')?.click()">
                <i class="bi bi-file-earmark-arrow-up me-1"></i>上传报价单
            </button>
            <button type="button" class="btn btn-outline-info btn-sm" onclick="document.getElementById('ocrUploadBtn')?.click()">
                <i class="bi bi-camera me-1"></i>OCR 图片
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('productsFile')?.click()">
                <i class="bi bi-box-arrow-in-up-right me-1"></i>补传商品库
            </button>
            <a href="{{ workspace_routes.templates }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-files me-1"></i>模板中心
            </a>
            <a href="{{ workspace_routes.guide }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-journal-text me-1"></i>使用说明
            </a>
        </div>
    </section>

    <div class="filter-bar quote-filter-bar">
        <div class="quote-filter-top">
            <div class="match-toolbar-title mb-0">
                <div class="match-toolbar-copy">
                    <div class="match-toolbar-heading">报价工作台</div>
                    <div class="match-toolbar-subtitle">搜索、筛选、排序、确认和导出都在这一页完成。</div>
                </div>
            </div>
            <div class="quote-toolbar-actions">
                <button class="btn btn-warning btn-sm" id="batchAdjustBtn">
                    <i class="bi bi-percent me-1"></i>批量调价
                </button>
                <button class="btn btn-success btn-sm" id="exportBtn">
                    <i class="bi bi-download me-1"></i>导出
                </button>
                <button class="btn btn-info btn-sm" id="shareBtn">
                    <i class="bi bi-share me-1"></i>分享
                </button>
            </div>
        </div>
        <div class="match-toolbar-divider"></div>
        <div class="row g-3 align-items-end">
            <div class="col-xxl-4 col-xl-4 col-md-6">
                <label class="form-label">搜索报价项</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="searchInput" placeholder="搜索产品名、规格、备注、品牌或供应商">
                    <button class="btn btn-outline-secondary" type="button" id="clearSearchBtn" title="清空搜索">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <div class="col-xxl-2 col-xl-3 col-md-6">
                <label class="form-label">状态</label>
                <select class="form-select" id="statusFilter">
                    <option value="all">全部状态</option>
                    <option value="pending">待确认</option>
                    <option value="matched">已匹配</option>
                    <option value="nomatch">无匹配</option>
                </select>
            </div>
            <div class="col-xxl-2 col-xl-3 col-md-6">
                <label class="form-label">排序</label>
                <select class="form-select" id="sortFilter">
                    <option value="default">默认排序</option>
                    <option value="match-desc">匹配度高到低</option>
                    <option value="match-asc">匹配度低到高</option>
                    <option value="price-desc">价格高到低</option>
                    <option value="price-asc">价格低到高</option>
                </select>
            </div>
            <div class="col-xxl-2 col-xl-2 col-md-6">
                <label class="form-label">快速操作</label>
                <button class="btn btn-outline-secondary w-100" id="resetFilterBtn">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>重置筛选
                </button>
            </div>
            <div class="col-xxl-2 col-xl-12 col-md-12">
                <div class="quote-filter-note">一次只处理一个报价项，左边看队列，中间做选择，右边做核查。</div>
            </div>
        </div>
        <div class="row mt-3" id="priceAdjustNotice" style="display: none;">
            <div class="col-12">
                <div class="match-notice-card">
                    <div class="match-notice-text"><i class="bi bi-info-circle me-2"></i><span id="adjustNoticeText"></span></div>
                    <button class="btn btn-sm btn-outline-secondary" id="clearAdjustBtn">清除调整</button>
                </div>
            </div>
        </div>
    </div>

    <div id="matchResults">
        <div class="workspace-empty-orbit workspace-empty-orbit--quotes workspace-empty-orbit--quotes-landing">
            <div class="workspace-empty-orbit-visual">
                <i class="bi bi-layout-text-window"></i>
            </div>
            <div class="workspace-empty-orbit-title">还没有报价结果</div>
            <div class="workspace-empty-orbit-copy">上传报价单或 OCR 后，这里会显示待处理队列、当前项和核查面板。</div>
            <div class="quote-empty-actions">
                <button type="button" class="btn btn-primary" onclick="document.getElementById('quoteFile')?.click()">
                    <i class="bi bi-file-earmark-arrow-up me-2"></i>上传报价单
                </button>
                <button type="button" class="btn btn-outline-info" onclick="document.getElementById('ocrUploadBtn')?.click()">
                    <i class="bi bi-camera me-2"></i>OCR 图片
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('productsFile')?.click()">
                    <i class="bi bi-box-arrow-in-up-right me-2"></i>补传商品库
                </button>
                <a href="{{ workspace_routes.templates }}" class="btn btn-outline-secondary">
                    <i class="bi bi-files me-2"></i>模板中心
                </a>
            </div>
        </div>
    </div>
</div>
