services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: saizheng-postgres-v2
    environment:
      POSTGRES_DB: saizheng_quote_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - saizheng_postgres_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d saizheng_quote_v2']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: saizheng-redis-v2
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - saizheng_redis_v2_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  saizheng_postgres_v2_data:
  saizheng_redis_v2_data:
